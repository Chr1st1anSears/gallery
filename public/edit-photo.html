<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Edit Photo - Gallery</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
              integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu"
              crossorigin="anonymous">
        <link rel="stylesheet" href="/styles.css">
        <script src="/__/firebase/12.1.0/firebase-app-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-auth-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-functions-compat.js"></script>
        <script src="/__/firebase/init.js"></script>
    </head>
    <body>
        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-header">
                    <div class="navbar-brand">Gallery</div>
                </div>
                <ul class="nav navbar-nav">
                    <li><a href="/">Home</a></li>
                    <li><a href="/photos.html">Photos</a></li>
                </ul>
            </div>
        </div>

        <div class="container" id="main-container">
            <h3>Edit Photo</h3>
            <form id="edit-photo-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="text" name="date" id="date" class="form-control"/>
                </div>
                
                <!-- === REMOVED: The old 'People in photo' input is gone === -->
                
                <!-- === NEW: The dynamic section for Related Photos === -->
                <div class="form-group">
                    <label>Related Photos</label>
                    <!-- This container will be filled by JavaScript -->
                    <div id="related-photos-container"></div>
                    <!-- This button will add new rows -->
                    <button type="button" id="add-related-photo-button" class="btn btn-default btn-sm" style="margin-top: 10px;">
                        <span class="glyphicon glyphicon-plus"></span> Add another
                    </button>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea name="description" id="description" class="form-control"></textarea>
                </div>
                <p id="form-status" class="text-danger" role="alert"></p>
                <button type="submit" id="submit-button" class="btn btn-success">Save Changes</button>
            </form>
        </div>

        <script src="common.js"></script>
        <script src="photo-form.js"></script>
        <script src="edit-photo.js"></script>
    </body>
</html>
