<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Gallery</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Note: I'm keeping Bootstrap for the navbar, but the main content will use custom styles. -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
              integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu"
              crossorigin="anonymous">
        
        <!-- Firebase SDKs -->
        <script src="/__/firebase/12.1.0/firebase-app-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-auth-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-functions-compat.js"></script>
        <script src="/__/firebase/init.js"></script>
        
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

        <style>
            /* --- Page Layout & Background --- */
            body, html {
                height: 100%;
                margin: 0;
                display: flex;
                flex-direction: column; /* Allows navbar at top, main content to fill rest */
            }

            .main-content {
                flex-grow: 1; /* Makes this container take up all available space */
                display: flex;
                align-items: flex-start; /* Aligns frame to the top */
                justify-content: center; /* Horizontally centers the frame */
                padding: 0px;
                box-sizing: border-box;
            }

            /* --- Frame Styling --- */
            .frame-container {
                background-image: url('/homepage_background.jpg');
                background-size: 100% 100%; /* Stretches the frame to fit the container */
                background-repeat: no-repeat;
                
                width: auto;
                height: auto;
                max-height: 85vh;  /* Keeps it within screen height on mobile */
                aspect-ratio: 3 / 4; /* Ensures the container keeps the frame's shape */
                
                display: flex;
                flex-direction: column;
                align-items: center; /* Horizontally centers content inside the frame */
                justify-content: center; /* Vertically centers content inside the frame */
                
                padding: 20% 18%; /* Pushes the content away from the frame's edges */
                box-sizing: border-box;
                text-align: center;
            }

            /* --- Font Styling --- */
            .navbar.navbar-default {
                font-family: 'EB Garamond', serif;
                font-weight: 700;
                flex-shrink: 0; /* Prevents navbar from shrinking */

                margin-bottom: 0;
                
                /* --- FIX #1: This removes the border from ALL sides, not just the bottom --- */
                border: none; 
                
                border-radius: 0;
                
                background-image: url('./IMG_8378.jpg'); /* YOU must provide this image file */
                background-size: cover;          /* Ensures the image covers the navbar */
                background-position: center center; /* Keeps the image centered */
            }
             
            /* This rule targets the 'Gallery' text*/
            .navbar-default .navbar-brand {
                color: #ffffff;
                font-size: 24px;
            }
            
            .navbar-default .navbar-nav > li > a,
            .navbar-default .navbar-brand a {  /* --- FIX #2: This rule now targets the Login/Logout links --- */
                color: #ffffff;
                font-size: 18px;
            }

            /* This rule ensures ALL links stay white on hover */
            .navbar-default .navbar-nav > li > a:hover,
            .navbar-default .navbar-nav > li > a:focus,
            .navbar-default .navbar-brand:hover,
            .navbar-default .navbar-brand:focus,
            .navbar-default .navbar-brand a:hover,   /* --- FIX #2 (Hover): Added this rule --- */
            .navbar-default .navbar-brand a:focus {  /* --- FIX #2 (Focus): Added this rule --- */
                color: #f1f1f1; /* A very slightly off-white for a subtle hover */
            }

            /* --- Homepage Content Styles (Unchanged) --- */
            .prompt-text, #scan-photo-button {
                font-family: 'EB Garamond', serif;
            }
            .prompt-text h3 {
                font-size: 26px;
                font-weight: 700; /* Bolder Garamond for the title */
            }
            .prompt-text p {
                font-size: 18px;
                margin-top: 15px;
            }
            #scan-photo-button {
                font-size: 20px;
                margin-top: 25px;
            }
            #status-message {
                font-family: 'EB Garamond', serif;
                font-style: italic;
                font-size: 16px;
                margin-top: 20px; /* Add space above the message */
                color: #555;
                min-height: 20px; /* Prevents layout shift when text appears */
            }
        </style>
    </head>
    <body>
        <!-- ... (Your HTML body remains exactly the same) ... -->
        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/">Gallery</a>
                </div>
                <ul class="nav navbar-nav">
                    <li><a href="/photos.html">Photos</a></li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li id="user-info" style="display: none;">
                        <div class="navbar-brand" id="user-name"></div>
                        <div class="navbar-brand"><a href="#" id="logout-button">Logout</a></div>
                    </li>
                    <li id="login-container">
                        <div class="navbar-brand"><a href="#" id="login-button">Login</a></div>
                    </li>
                </ul>
            </div>
        </div>

        <main class="main-content">
            <div class="frame-container">
                <div class="prompt-text">
                    <h3>Choose a photo, we'll tell you its tale</h3>
                    <p><i>Stand close, zoom in, and try to minimize glare!</i></p>
                </div>
                
                <button id="scan-photo-button" class="btn btn-primary btn-lg">
                    <span class="glyphicon glyphicon-camera"></span>
                    Scan Photo
                </button>

                <div id="status-message"></div>
            </div>
        </main>
        
        <input type="file" id="camera-input" style="display: none;" accept="image/*" capture="environment"/>
                
        <script src="common.js"></script>
        <script src="app.js"></script>
    </body>
</html>
