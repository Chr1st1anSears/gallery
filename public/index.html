<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Gallery</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        
        <!-- Firebase SDKs -->
        <script src="/__/firebase/12.1.0/firebase-app-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-auth-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-firestore-compat.js"></script>
        <script src="/__/firebase/12.1.0/firebase-functions-compat.js"></script>
        <script src="/__/firebase/init.js"></script>
        
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

        <style>
            /* --- Font Styling --- */

            /* 1. Use Playfair Display for the navbar */
            .navbar.navbar-default {
                font-family: 'Playfair Display', serif;
                font-weight: 700; /* Use the bold weight we imported */
            }
            .navbar-brand, .nav > li > a {
                 font-size: 18px; /* Slightly increase navbar font size */
            }


            /* 2. Use Playfair Display for the Scan Photo button */
            #scan-photo-button {
                font-family: 'EB Garamond', serif;
                font-weight: 700;
                font-size: 22px; /* Make the button text a bit larger */
                margin-top: 20px; /* Add some space above the button */
            }

            /* 3. Use EB Garamond for the prompt text */
            .prompt-text {
                font-family: 'EB Garamond', serif;
            }
            .prompt-text h3 {
                font-size: 28px;
            }
            .prompt-text p {
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/">Gallery</a>
                </div>
                <ul class="nav navbar-nav">
                    <li><a href="/photos.html">Photos</a></li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li id="user-info" style="display: none;">
                        <div class="navbar-brand" id="user-name"></div>
                        <div class="navbar-brand"><a href="#" id="logout-button">Logout</a></div>
                    </li>
                    <li id="login-container">
                        <div class="navbar-brand"><a href="#" id="login-button">Login</a></div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Added a wrapper div with a class for easier styling -->
        <div class="container prompt-text" style="text-align: center; padding-top: 50px;">
            <h3>Choose a photo and we'll tell you its tale.</h3>
            <p><i>Stand close, zoom in, and try to minimize glare!</i></p>
            
            <button id="scan-photo-button" class="btn btn-primary btn-lg">
                <span class="glyphicon glyphicon-camera"></span>
                Scan Photo
            </button>

            <input type="file" id="camera-input" style="display: none;" accept="image/*" capture="environment"/>
            
            <div id="status-message" style="padding-top: 20px;"></div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
