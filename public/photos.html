<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Gallery</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
              integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu"
              crossorigin="anonymous">
        <link rel="stylesheet" href="/styles.css">
        <script defer src="/__/firebase/12.1.0/firebase-app-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-auth-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-functions-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-storage-compat.js"></script>
        <script defer src="/__/firebase/init.js"></script>
    </head>
    <body>
        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/">Gallery</a>
                </div>
                <ul class="nav navbar-nav">
                    <li><a href="#" id="scan-photo-button">Scan</a></li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li id="user-info" style="display: none;">
                        <div class="navbar-brand" id="user-name"></div>
                        <div class="navbar-brand"><a href="#" id="logout-button">Logout</a></div>
                    </li>
                    <li id="login-container">
                        <div class="navbar-brand"><a href="#" id="login-button">Login</a></div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="container">
            <p id="status-message"></p>
            <h3><strong>Photos</strong></h3>

            <a href="/add-photo.html" id="add-photo-button" class="btn btn-success btn-sm" style="display: none;">
                <i class="glyphicon glyphicon-plus"></i>
                Add Photo
            </a>

            <div id="photo-gallery-container">
                </div>
            
            <p id="loading-message">Loading photos...</p>

        </div>
        <input type="file" id="camera-input" style="display: none;" accept="image/*" capture="environment"/>
        <script src="common.js"></script>
        <script src="photos.js"></script>
    </body>
</html>
