<!DOCTYPE html>
<html lang="en">
    <head>
        <title>View Photo - Gallery</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <link rel="stylesheet" href="/styles.css">
        <script defer src="/__/firebase/12.1.0/firebase-app-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-auth-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-firestore-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-functions-compat.js"></script>
        <script defer src="/__/firebase/12.1.0/firebase-storage-compat.js"></script>
        <script defer src="/__/firebase/init.js?useEmulator=true"></script>
        <style>
            #status-message {
                margin: 0; 
                padding: 0;
                height: auto;
                min-height: 0px; /* Prevents layout shift when text appears */
            }
        </style>
    </head>
    <body>
        <div class="navbar navbar-default">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/">Gallery</a>
                </div>
                <ul class="nav navbar-nav">
                    <li><a href="#" id="scan-photo-button">Scan another</a></li>
                </ul>
            </div>
        </div>

        <div class="container" id="photo-detail-container">
            <p>Loading photo details...</p>
        </div>

        <div id="status-message"></div>
        <input type="file" id="camera-input" style="display: none;" accept="image/*" capture="environment"/>
        <script src="view-photo.js"></script>
    </body>
</html>
